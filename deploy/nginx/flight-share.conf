# Install in a directory included by nginx's http block, e.g. /etc/nginx/conf.d/.
# Replace the hostname, certificate paths and upstream for your deployment.
map $http_upgrade $flight_share_connection_upgrade {
    default upgrade;
    '' close;
}

upstream flight_share_app {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name flight-share.example.com;

    return 301 https://flight-share.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flight-share.example.com;

    ssl_certificate /etc/letsencrypt/live/flight-share.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flight-share.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://flight_share_app;
    }

    location /socket.io/ {
        # nginx inherits proxy_set_header only when none is set at the child level.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flight_share_connection_upgrade;
        proxy_read_timeout 65s;
        proxy_buffering off;
        proxy_pass http://flight_share_app;
    }
}