name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and publish the paired app and migration images
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a release tag such as v1.0.0'; exit 1; }
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$repository:$RELEASE_TAG" .
          docker build --target migration -t "$repository-migration:$RELEASE_TAG" .
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$repository-migration:$RELEASE_TAG"
          docker push "$repository:$RELEASE_TAG"